name: QProduct
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lean-runtime==4.33.0
      - name: Build mathematical and LeanCert surfaces, examples, and audits
        run: lake build QProduct QProductLeanCert Examples Tests
      - name: Verify high-precision prime constant
        run: lake build PrimeLambdaDigits
      - name: Check documentation examples
        run: python scripts/check_docs.py
      - name: Check exact project context through Lean Runtime
        run: lean-runtime check --using . --offline Examples/PrimeLambda.lean
